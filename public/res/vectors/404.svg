<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <defs>
        <style>.cls-1{fill:#d7f2ff;}.cls-2,.cls-3,.cls-4{fill:none;stroke:#000;stroke-miterlimit:10;}.cls-2,.cls-4{stroke-width:5px;}.cls-3{stroke-width:4px;}.cls-4{stroke-linecap:round;}.cls-5,.cls-6{opacity:0.35;}.cls-5{fill:url(#linear-gradient);}.cls-6{fill:url(#linear-gradient-2);}
            #Moon{
                animation: 10s spin infinite linear;
                transform-origin:center;
                transform-box:fill-box;  
            }
            @keyframes spin {
               0% {transform: rotate(0deg) }
               25% {transform: rotate(5deg) }
               50% {transform: rotate(0deg) }
               70% {transform: rotate(-5deg) }
             }

            #Astronaut{
                animation: 5s float infinite ease-in-out;
                transform-origin: 50% 0%;
                transform-box:fill-box; 
            }
            #Rocket{
                animation: 7s float infinite ease-in-out;
                transform-origin: 50% 20%;
                transform-box:fill-box;
            }
            @keyframes float {
              0%{transform: rotate(3deg)}
              50%{transform: rotate(-3deg)}
              100%{transform: rotate(3deg)}
            }
            #Cross{
                animation: 5s floatfast infinite ease-in-out;
                transform-origin: 50% 50%;
                transform-box:fill-box; 
            }
            @keyframes floatfast {
                0%{transform: rotate(-5deg)}
                50%{transform: rotate(5deg)}
                100%{transform: rotate(-5deg)}
              }

              #rope{
                animation: 10s float infinite ease-in-out;
                transform-origin: 50% 50%;
                transform-box:fill-box;
            }
            @keyframes float {
              0%{transform: rotate(1deg)}
              50%{transform: rotate(-1deg)}
              100%{transform: rotate(1deg)}
            }

            
        </style>
        <linearGradient id="linear-gradient" x1="927.16" y1="229.19" x2="1067.9" y2="229.19" gradientUnits="userSpaceOnUse">
